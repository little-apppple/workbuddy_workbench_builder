<!-- UI 模板: sidebar（侧边栏导航 + 内容面板） -->
<!-- 用法: 复制本骨架作为工作台框架，右侧 main 内按选中模块插入面板 -->
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · sidebar</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;
--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--danger:#e5484d;--ok:#2fa66a;
--radius:14px;--shadow:0 4px 18px rgba(20,30,60,.08);--gap:16px}
[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;
--text-dim:#94a0b3;--border:#2a313d;--accent-weak:#1c2740;--shadow:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;flex:0 0 220px;background:var(--surface);border-right:1px solid var(--border);
padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
cursor:pointer;color:var(--text-dim)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.main{flex:1;padding:24px;overflow:auto}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
box-shadow:var(--shadow);padding:16px}
@media(max-width:720px){body{flex-direction:column}.sidebar{width:100%;flex:none;
flex-direction:row;overflow:auto}.main{padding:16px}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">🧰 我的工作台</div>
  <!-- 每个模块一个 nav-item，点击切 .panel -->
  <div class="nav-item active" data-mod="todo">✅ 待办</div>
  <div class="nav-item" data-mod="mem">💡 速记</div>
  <div class="nav-item" data-mod="dashboard">📊 概览</div>
</aside>
<main class="main">
  <section class="panel active" data-mod="todo"><div class="card">待办面板</div></section>
  <section class="panel" data-mod="mem"><div class="card">速记面板</div></section>
  <section class="panel" data-mod="dashboard"><div class="card">概览面板</div></section>
</main>
</body>
</html>
