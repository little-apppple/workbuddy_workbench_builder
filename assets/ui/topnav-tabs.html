<!-- UI 模板: topnav（顶部导航 + 标签页） -->
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · topnav</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;
--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--danger:#e5484d;--ok:#2fa66a;
--radius:14px;--shadow:0 4px 18px rgba(20,30,60,.08);--gap:16px}
[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;
--text-dim:#94a0b3;--border:#2a313d;--accent-weak:#1c2740;--shadow:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text)}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;
display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
.brand{font-weight:700;margin-right:14px}
.tab{padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--text-dim)}
.tab.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.main{padding:24px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
box-shadow:var(--shadow);padding:16px}
@media(max-width:720px){.topbar{flex-wrap:wrap}.main{padding:16px}}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">🧰 我的工作台</span>
  <span class="tab active" data-mod="todo">✅ 待办</span>
  <span class="tab" data-mod="mem">💡 速记</span>
  <span class="tab" data-mod="dashboard">📊 概览</span>
</div>
<main class="main">
  <section class="panel active" data-mod="todo"><div class="card">待办面板</div></section>
  <section class="panel" data-mod="mem"><div class="card">速记面板</div></section>
  <section class="panel" data-mod="dashboard"><div class="card">概览面板</div></section>
</main>
</body>
</html>
