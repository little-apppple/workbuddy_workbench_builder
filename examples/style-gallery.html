<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 风格预设画廊 · Workbench Builder</title>
<!--
  用途：预览 workbench-builder 的全部 UI 风格预设（与 reference-workbench.html 共用同一组设计 token）。
  切换 WORKBENCH_CONFIG.style 即全局换肤，这里每个区块用 data-style 就地演示。
-->
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;
--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--danger:#e5484d;--ok:#2fa66a;
--radius:14px;--shadow:0 4px 18px rgba(20,30,60,.08);--gap:16px}
[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;
--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740;--shadow:0 4px 18px rgba(0,0,0,.45)}
/* ============ UI 风格预设（与种子文件完全一致）============ */
[data-style="default"]{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--radius:14px}
[data-style="default"][data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740}
[data-style="macaron"]{--bg:#fbf7fc;--surface:#fff;--surface-2:#f4edf8;--text:#4a4258;--text-dim:#9b8fae;--border:#ece2f3;--accent:#b48ad4;--accent-weak:#f1e9fb;--radius:18px}
[data-style="macaron"][data-theme="dark"]{--bg:#171320;--surface:#211a2c;--surface-2:#2a2236;--text:#efeaf6;--text-dim:#b3a6c4;--border:#352b45;--accent:#c9a3e6;--accent-weak:#2e2440}
[data-style="ink"]{--bg:#fafafa;--surface:#fff;--surface-2:#f0f0f3;--text:#18181b;--text-dim:#71717a;--border:#e4e4e7;--accent:#33334d;--accent-weak:#eaeaef;--radius:8px}
[data-style="ink"][data-theme="dark"]{--bg:#0a0a0b;--surface:#161618;--surface-2:#232326;--text:#fafafa;--text-dim:#a1a1aa;--border:#2e2e32;--accent:#a0a0c8;--accent-weak:#26263a}
[data-style="ocean"]{--bg:#f1f8f9;--surface:#fff;--surface-2:#e3f1f2;--text:#1c3a3d;--text-dim:#5b858a;--border:#d3e8ea;--accent:#0f8b8f;--accent-weak:#d8f0f1;--radius:12px}
[data-style="ocean"][data-theme="dark"]{--bg:#0b1719;--surface:#132225;--surface-2:#1b2e31;--text:#e2f1f2;--text-dim:#7fafb1;--border:#224044;--accent:#2bc4c0;--accent-weak:#16383a}
[data-style="sunset"]{--bg:#fff6f2;--surface:#fff;--surface-2:#fdeae2;--text:#4a2e26;--text-dim:#a9786a;--border:#f6dccf;--accent:#f0735f;--accent-weak:#ffe2d8;--radius:16px}
[data-style="sunset"][data-theme="dark"]{--bg:#1c1012;--surface:#281a1c;--surface-2:#332225;--text:#fbeae4;--text-dim:#c39a8e;--border:#43292b;--accent:#ff8a72;--accent-weak:#3a2220}
/* wb · WorkBuddy 官方 */
[data-style="wb"]{--bg:#f4f3ee;--surface:#fff;--surface-2:#eceae2;--text:#2c2c2a;--text-dim:#5f5e5a;--border:#d3d1c7;--accent:#185fa5;--accent-weak:#e6f1fb;--radius:8px}
[data-style="wb"][data-theme="dark"]{--bg:#1c1b18;--surface:#2c2c2a;--surface-2:#444441;--text:#f1efe8;--text-dim:#b4b2a9;--border:#5f5e5a;--accent:#85b7eb;--accent-weak:#1a2633}
/* nord · 北欧极地 */
[data-style="nord"]{--bg:#eceff4;--surface:#f7f9fc;--surface-2:#dfe5ee;--text:#2e3440;--text-dim:#4c566a;--border:#d1dae4;--accent:#5e81ac;--accent-weak:#dfe7f2;--radius:10px}
[data-style="nord"][data-theme="dark"]{--bg:#2e3440;--surface:#3b4252;--surface-2:#434c5e;--text:#eceff4;--text-dim:#aeb8c9;--border:#4c566a;--accent:#88c0d0;--accent-weak:#3f4d63}
/* catppuccin · 奶咖粉彩 */
[data-style="catppuccin"]{--bg:#eff1f5;--surface:#f7f8fb;--surface-2:#e3e6ef;--text:#4c4f69;--text-dim:#7c7f93;--border:#d4d8e3;--accent:#8839ef;--accent-weak:#e7defa;--radius:14px}
[data-style="catppuccin"][data-theme="dark"]{--bg:#1e1e2e;--surface:#181825;--surface-2:#313244;--text:#cdd6f4;--text-dim:#a6adc8;--border:#45475a;--accent:#cba6f7;--accent-weak:#453759}
/* rosepine · 玫瑰松 */
[data-style="rosepine"]{--bg:#faf4ed;--surface:#fffaf3;--surface-2:#f2e9e1;--text:#575279;--text-dim:#797593;--border:#e5dfd6;--accent:#d7827e;--accent-weak:#f4e3e0;--radius:16px}
[data-style="rosepine"][data-theme="dark"]{--bg:#191724;--surface:#1f1d2e;--surface-2:#26233a;--text:#e0def4;--text-dim:#908caa;--border:#403d52;--accent:#ebbcba;--accent-weak:#3b3550}
/* tokyonight · 东京夜 */
[data-style="tokyonight"]{--bg:#e1e2e7;--surface:#edeff5;--surface-2:#d8dce6;--text:#376188;--text-dim:#5a6b84;--border:#c8cede;--accent:#34548a;--accent-weak:#d4dcec;--radius:10px}
[data-style="tokyonight"][data-theme="dark"]{--bg:#1a1b26;--surface:#24283b;--surface-2:#292e42;--text:#c0caf5;--text-dim:#8189af;--border:#3b4261;--accent:#7aa2f7;--accent-weak:#2a2f45}
/* everforest · 常青森林 */
[data-style="everforest"]{--bg:#faf5e9;--surface:#fffdf5;--surface-2:#eee8d8;--text:#4d5c53;--text-dim:#7d8c80;--border:#ddd6c2;--accent:#8da101;--accent-weak:#e8efd0;--radius:12px}
[data-style="everforest"][data-theme="dark"]{--bg:#2d353b;--surface:#343f44;--surface-2:#3d484d;--text:#d3c6aa;--text-dim:#9da9a0;--border:#4f585e;--accent:#a7c080;--accent-weak:#3c4a42}
/* mono · 纯粹黑白 */
[data-style="mono"]{--bg:#ffffff;--surface:#fafafa;--surface-2:#f0f0f0;--text:#111111;--text-dim:#777777;--border:#e2e2e2;--accent:#111111;--accent-weak:#eeeeee;--radius:4px}
[data-style="mono"][data-theme="dark"]{--bg:#0d0d0d;--surface:#141414;--surface-2:#1e1e1e;--text:#f5f5f5;--text-dim:#9a9a9a;--border:#2a2a2a;--accent:#f5f5f5;--accent-weak:#242424}
/* claw · 企业蓝（借鉴缮语·企业 Claw 经营工作台） */
[data-style="claw"]{--bg:#f0f2f5;--surface:#fff;--surface-2:#f5f7fa;--text:#1f2430;--text-dim:#5f6b7d;--border:#dfe4ec;--accent:#1677ff;--accent-weak:#e6f4ff;--radius:8px}
[data-style="claw"][data-theme="dark"]{--bg:#0a1628;--surface:#101f35;--surface-2:#16273f;--text:#e6f0ff;--text-dim:#8ba3c2;--border:#223a5c;--accent:#3c8dff;--accent-weak:#12305c}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:0 0 40px}
header{padding:24px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
header h1{margin:0 0 4px;font-size:20px}
header p{margin:0;color:var(--text-dim);font-size:13px}
.bar{margin-top:14px;display:flex;gap:8px;align-items:center}
.bar button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px;background:var(--surface-2);color:var(--text)}
.bar button.active{background:var(--accent);color:#fff}
.wrap{max-width:1100px;margin:24px auto;padding:0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.preview{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow)}
.pv-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.pv-name{font-weight:700;font-size:15px}
.pv-desc{color:var(--text-dim);font-size:12px}
.pv-body{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px}
.kpi{display:flex;gap:10px}
.kpi .box{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.kpi .v{font-size:20px;font-weight:700;color:var(--accent)}
.kpi .l{font-size:11px;color:var(--text-dim)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.card .t{font-weight:600}
.card .m{font-size:12px;color:var(--text-dim);margin-top:2px}
.row{display:flex;gap:8px}
button.b-primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 12px;cursor:pointer}
button.b-ghost{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--text)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:12px}
footer{max-width:1100px;margin:8px auto 0;padding:0 24px;color:var(--text-dim);font-size:12px}
code{background:var(--surface-2);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<header>
  <h1>🎨 UI 风格预设画廊</h1>
  <p>每个区块都是同一套设计 token 的实时呈现。把心仪的 <code>data-style</code> 填入 <code>WORKBENCH_CONFIG.style</code> 即全局换肤。</p>
  <div class="bar">
    <span style="color:var(--text-dim);font-size:13px">主题：</span>
    <button id="bLight" class="active" onclick="setTheme('light')">☀ 浅色</button>
    <button id="bDark" onclick="setTheme('dark')">🌙 深色</button>
  </div>
</header>

<div class="wrap"><div class="grid" id="grid"></div></div>

<footer>
  预设清单：<code>default</code> 云灰蓝 · <code>macaron</code> 马卡龙 · <code>ink</code> 墨韵 · <code>ocean</code> 深海 · <code>sunset</code> 晚霞。
  运行时也可点工作台右上角「🎨 风格」当场切换并持久化到 localStorage。
</footer>

<script>
const PREVIEWS=[
  {style:'default',   name:'云灰蓝',     desc:'中性蓝灰，专业克制'},
  {style:'wb',        name:'WorkBuddy', desc:'官方同源，无缝融入'},
  {style:'macaron',   name:'马卡龙',     desc:'粉彩柔润，轻盈治愈'},
  {style:'ink',       name:'墨韵',       desc:'极简黑白，锋利高级'},
  {style:'ocean',     name:'深海',       desc:'青蓝静谧，清爽专注'},
  {style:'sunset',    name:'晚霞',       desc:'暖橙活力，亲和明快'},
  {style:'nord',      name:'北欧',       desc:'极地冷色，沉稳理性'},
  {style:'catppuccin',name:'奶咖',       desc:'柔和低饱和，长时舒适'},
  {style:'rosepine',  name:'玫瑰松',     desc:'暮色玫瑰，温润雅致'},
  {style:'tokyonight',name:'东京夜',     desc:'霓虹深蓝，都市夜色'},
  {style:'everforest',name:'常青',       desc:'森林抹茶，自然疗愈'},
  {style:'mono',      name:'纯粹',       desc:'黑白极简，零干扰'},
  {style:'claw',      name:'企业蓝',     desc:'商务科技，数据密集'}
];
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('bLight').classList.toggle('active',t==='light');
  document.getElementById('bDark').classList.toggle('active',t==='dark');
}
function sampleBody(){
  return '<div class="kpi">'
    +'<div class="box"><div class="v">12</div><div class="l">待办</div></div>'
    +'<div class="box"><div class="v">3</div><div class="l">本周</div></div></div>'
    +'<div class="card"><div class="t"><span class="dot"></span>完成季度复盘</div><div class="m">今天 · 高优先级</div></div>'
    +'<div class="card"><div class="t">读书笔记</div><div class="m" style="margin-bottom:8px">《深度工作》第三章</div>'
    +'<span class="tag">reading</span></div>'
    +'<div class="row"><button class="b-primary">添加</button><button class="b-ghost">导入 CSV</button></div>';
}
const grid=document.getElementById('grid');
PREVIEWS.forEach(p=>{
  if(!p.name) return;
  const sec=document.createElement('section');
  sec.className='preview'; sec.setAttribute('data-style',p.style); sec.setAttribute('data-theme','light');
  sec.innerHTML='<div class="pv-head"><div><div class="pv-name">'+p.name+'</div>'
    +'<div class="pv-desc">'+p.desc+' · <code>'+p.style+'</code></div></div></div>'
    +'<div class="pv-body">'+sampleBody()+'</div>';
  grid.appendChild(sec);
});
</script>
</body>
</html>
