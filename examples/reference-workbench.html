<!doctype html>
<html lang="zh-CN" data-theme="light" data-style="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  Workbench Builder · 单文件工作台种子                          ║
  ║  用法：修改下方 WORKBENCH_CONFIG 即可切换模块与 UI 模板。        ║
  ║  - modules: 从 [todo,mem,dashboard,notes,links,kanban,calendar, ║
  ║            ledger,habits,reading,contacts,inventory,journal,news,resources, ║
  ║            briefing,insight,approvals,cron] 中挑选（共 19 个模块） ║
  ║  - ui:       sidebar | cardGrid | topnav | masonry             ║
  ║  - theme:    light | dark | auto                               ║
  ║  - style:    13 套预设（见 STYLES / ui-design-system.md）         ║
  ║  数据（v1.2 起）：资料库 page 运行时直连 DATABASE_ID 节点，自动双向 ║
  ║      同步（外部改 CSV/资料库→前端轮询刷新；前端改→直写库）。         ║
  ║      本地 file:// 预览无 SDK 时自动降级 localStorage（仅演示用）。   ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;
--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--danger:#e5484d;--ok:#2fa66a;--warn:#e8a33d;
--radius:14px;--shadow:0 4px 18px rgba(20,30,60,.08);--gap:16px}
[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;
--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740;--shadow:0 4px 18px rgba(0,0,0,.45)}
/* ============ UI 风格预设（全局一致，仅覆盖同一组 token）============ */
/* default · 云灰蓝 */
[data-style="default"]{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--radius:14px}
[data-style="default"][data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740}
/* macaron · 马卡龙粉彩 */
[data-style="macaron"]{--bg:#fbf7fc;--surface:#fff;--surface-2:#f4edf8;--text:#4a4258;--text-dim:#9b8fae;--border:#ece2f3;--accent:#b48ad4;--accent-weak:#f1e9fb;--radius:18px}
[data-style="macaron"][data-theme="dark"]{--bg:#171320;--surface:#211a2c;--surface-2:#2a2236;--text:#efeaf6;--text-dim:#b3a6c4;--border:#352b45;--accent:#c9a3e6;--accent-weak:#2e2440}
/* ink · 墨韵极简 */
[data-style="ink"]{--bg:#fafafa;--surface:#fff;--surface-2:#f0f0f3;--text:#18181b;--text-dim:#71717a;--border:#e4e4e7;--accent:#33334d;--accent-weak:#eaeaef;--radius:8px}
[data-style="ink"][data-theme="dark"]{--bg:#0a0a0b;--surface:#161618;--surface-2:#232326;--text:#fafafa;--text-dim:#a1a1aa;--border:#2e2e32;--accent:#a0a0c8;--accent-weak:#26263a}
/* ocean · 深海青蓝 */
[data-style="ocean"]{--bg:#f1f8f9;--surface:#fff;--surface-2:#e3f1f2;--text:#1c3a3d;--text-dim:#5b858a;--border:#d3e8ea;--accent:#0f8b8f;--accent-weak:#d8f0f1;--radius:12px}
[data-style="ocean"][data-theme="dark"]{--bg:#0b1719;--surface:#132225;--surface-2:#1b2e31;--text:#e2f1f2;--text-dim:#7fafb1;--border:#224044;--accent:#2bc4c0;--accent-weak:#16383a}
/* sunset · 晚霞暖橙 */
[data-style="sunset"]{--bg:#fff6f2;--surface:#fff;--surface-2:#fdeae2;--text:#4a2e26;--text-dim:#a9786a;--border:#f6dccf;--accent:#f0735f;--accent-weak:#ffe2d8;--radius:16px}
[data-style="sunset"][data-theme="dark"]{--bg:#1c1012;--surface:#281a1c;--surface-2:#332225;--text:#fbeae4;--text-dim:#c39a8e;--border:#43292b;--accent:#ff8a72;--accent-weak:#3a2220}
/* wb · WorkBuddy 官方（宿主同源：暖灰纸感 + 官方蓝 c-blue，radius 8 对齐 --border-radius-md） */
[data-style="wb"]{--bg:#f4f3ee;--surface:#fff;--surface-2:#eceae2;--text:#2c2c2a;--text-dim:#5f5e5a;--border:#d3d1c7;--accent:#185fa5;--accent-weak:#e6f1fb;--radius:8px}
[data-style="wb"][data-theme="dark"]{--bg:#1c1b18;--surface:#2c2c2a;--surface-2:#444441;--text:#f1efe8;--text-dim:#b4b2a9;--border:#5f5e5a;--accent:#85b7eb;--accent-weak:#1a2633}
/* nord · 北欧极地（Nord 官方 Polar Night / Snow Storm / Frost） */
[data-style="nord"]{--bg:#eceff4;--surface:#f7f9fc;--surface-2:#dfe5ee;--text:#2e3440;--text-dim:#4c566a;--border:#d1dae4;--accent:#5e81ac;--accent-weak:#dfe7f2;--radius:10px}
[data-style="nord"][data-theme="dark"]{--bg:#2e3440;--surface:#3b4252;--surface-2:#434c5e;--text:#eceff4;--text-dim:#aeb8c9;--border:#4c566a;--accent:#88c0d0;--accent-weak:#3f4d63}
/* catppuccin · 奶咖粉彩（Catppuccin 官方 Latte / Mocha） */
[data-style="catppuccin"]{--bg:#eff1f5;--surface:#f7f8fb;--surface-2:#e3e6ef;--text:#4c4f69;--text-dim:#7c7f93;--border:#d4d8e3;--accent:#8839ef;--accent-weak:#e7defa;--radius:14px}
[data-style="catppuccin"][data-theme="dark"]{--bg:#1e1e2e;--surface:#181825;--surface-2:#313244;--text:#cdd6f4;--text-dim:#a6adc8;--border:#45475a;--accent:#cba6f7;--accent-weak:#453759}
/* rosepine · 玫瑰松（Rosé Pine 官方 Main / Dawn） */
[data-style="rosepine"]{--bg:#faf4ed;--surface:#fffaf3;--surface-2:#f2e9e1;--text:#575279;--text-dim:#797593;--border:#e5dfd6;--accent:#d7827e;--accent-weak:#f4e3e0;--radius:16px}
[data-style="rosepine"][data-theme="dark"]{--bg:#191724;--surface:#1f1d2e;--surface-2:#26233a;--text:#e0def4;--text-dim:#908caa;--border:#403d52;--accent:#ebbcba;--accent-weak:#3b3550}
/* tokyonight · 东京夜（Tokyo Night 官方 Night / Day） */
[data-style="tokyonight"]{--bg:#e1e2e7;--surface:#edeff5;--surface-2:#d8dce6;--text:#376188;--text-dim:#5a6b84;--border:#c8cede;--accent:#34548a;--accent-weak:#d4dcec;--radius:10px}
[data-style="tokyonight"][data-theme="dark"]{--bg:#1a1b26;--surface:#24283b;--surface-2:#292e42;--text:#c0caf5;--text-dim:#8189af;--border:#3b4261;--accent:#7aa2f7;--accent-weak:#2a2f45}
/* everforest · 常青森林（Everforest 官方 light / dark） */
[data-style="everforest"]{--bg:#faf5e9;--surface:#fffdf5;--surface-2:#eee8d8;--text:#4d5c53;--text-dim:#7d8c80;--border:#ddd6c2;--accent:#8da101;--accent-weak:#e8efd0;--radius:12px}
[data-style="everforest"][data-theme="dark"]{--bg:#2d353b;--surface:#343f44;--surface-2:#3d484d;--text:#d3c6aa;--text-dim:#9da9a0;--border:#4f585e;--accent:#a7c080;--accent-weak:#3c4a42}
/* mono · 纯粹黑白（minimal 极简：白纸黑字、4px 锐角、零彩色装饰） */
[data-style="mono"]{--bg:#ffffff;--surface:#fafafa;--surface-2:#f0f0f0;--text:#111111;--text-dim:#777777;--border:#e2e2e2;--accent:#111111;--accent-weak:#eeeeee;--radius:4px}
[data-style="mono"][data-theme="dark"]{--bg:#0d0d0d;--surface:#141414;--surface-2:#1e1e1e;--text:#f5f5f5;--text-dim:#9a9a9a;--border:#2a2a2a;--accent:#f5f5f5;--accent-weak:#242424}
/* claw · 企业蓝（借鉴缮语·企业 Claw 经营工作台：商务科技蓝白 + 绿/橙/红状态编码） */
[data-style="claw"]{--bg:#f0f2f5;--surface:#fff;--surface-2:#f5f7fa;--text:#1f2430;--text-dim:#5f6b7d;--border:#dfe4ec;--accent:#1677ff;--accent-weak:#e6f4ff;--radius:8px}
[data-style="claw"][data-theme="dark"]{--bg:#0a1628;--surface:#101f35;--surface-2:#16273f;--text:#e6f0ff;--text-dim:#8ba3c2;--border:#223a5c;--accent:#3c8dff;--accent-weak:#12305c}
*{box-sizing:border-box}
body{margin:0;padding-bottom:100px;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);transition:background .2s,color .2s}
*{box-sizing:border-box}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface-2);border:1px solid var(--border);
border-radius:10px;padding:8px 10px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-del{background:transparent;color:var(--danger);padding:4px 8px}
.btn-edit{background:transparent;color:var(--text-dim);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row input{flex:1;min-width:120px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface-2);
border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.item .t{flex:1;word-break:break-all}
.item.done .t{text-decoration:line-through;color:var(--text-dim)}
.item a.t{color:var(--accent);text-decoration:none}
.meta{color:var(--text-dim);font-size:12px;white-space:nowrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.kpi-v{font-size:24px;font-weight:700;color:var(--accent)}
.kpi-l{color:var(--text-dim);font-size:12px;margin-top:2px}
.chart{width:100%;max-width:560px;background:var(--surface-2);border:1px solid var(--border);
border-radius:12px;margin-bottom:14px}
h4{margin:14px 0 8px}
.note-list{display:flex;flex-direction:column;gap:10px}
.note-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.note-h{font-weight:600;margin-bottom:4px}
.note-b{color:var(--text-dim);white-space:pre-wrap}
.note-card .meta{margin:6px 0}
.note-card>button{float:right;margin-left:4px}
/* 布局：sidebar */
body.layout-sidebar #app{display:flex;min-height:100vh;justify-content:center}
.layout-sidebar .sidebar{width:220px;flex:0 0 220px;background:var(--surface);
border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.layout-sidebar .brand{font-weight:700;font-size:16px;padding:6px 10px 14px}
.layout-sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
border-radius:10px;cursor:pointer;color:var(--text-dim)}
.layout-sidebar .nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.layout-sidebar .main{flex:1 1 auto;min-width:0;max-width:1100px;padding:24px 24px 100px;overflow:auto}
.layout-sidebar .panel{display:none}.layout-sidebar .panel.active{display:block}
/* 布局：cardGrid / masonry 共用 topbar */
.topbar{padding:18px 24px;font-weight:700;font-size:18px;background:var(--surface);
border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap);align-items:start;max-width:1180px;margin:16px auto 24px;padding:0 24px}
.grid .card,.masonry .card{background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
/* 布局：topnav */
.layout-topnav .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:12px 20px}
.layout-topnav .brand{font-weight:700;margin-right:14px}
.layout-topnav .tab{padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--text-dim)}
.layout-topnav .tab.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.layout-topnav .main{padding:24px 24px 100px;max-width:1100px;margin:0 auto}
.layout-topnav .panel{display:none}.layout-topnav .panel.active{display:block}
/* 布局：masonry */
.masonry{column-count:3;column-gap:var(--gap);max-width:1180px;margin:16px auto 24px;padding:0 24px}
.masonry .card{break-inside:avoid;margin-bottom:var(--gap)}
@media(max-width:1024px){.masonry{column-count:2}}
@media(max-width:720px){.layout-sidebar #app{flex-direction:column}.layout-sidebar .sidebar{width:100%;flex:none;flex-direction:row;overflow:auto}
.layout-sidebar .main{padding:16px}.grid{grid-template-columns:1fr;padding:0 16px 16px}.masonry{column-count:1;padding:0 16px 16px}
.layout-topnav .main{padding:16px}.topbar{padding:14px 16px}}
/* 工具栏 */
.toolbar{position:fixed;right:16px;bottom:16px;top:auto;display:flex;gap:6px;z-index:20;flex-wrap:wrap;max-width:min(92vw,520px);justify-content:flex-end;
background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.toolbar button{background:var(--surface-2);padding:6px 10px;font-size:13px}
.toolbar button:hover{background:var(--accent-weak);color:var(--accent)}
/* toast */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;
transition:.25s;z-index:30;pointer-events:none;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 风格选择弹层（token 驱动，与全站一致） */
.modal-mask{position:fixed;inset:0;background:rgba(15,18,24,.42);display:none;align-items:center;justify-content:center;z-index:40}
.modal-mask.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;width:min(720px,92vw);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--text-dim);font-size:13px;margin-bottom:14px}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.style-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.style-card:hover{border-color:var(--accent)}
.style-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.style-swatch{height:64px;border-radius:8px;overflow:hidden;display:flex;gap:4px;padding:8px}
.style-swatch i{flex:1;border-radius:4px;display:block}
.style-name{font-weight:600;margin-top:8px;font-size:14px}
.style-desc{color:var(--text-dim);font-size:12px;margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 配置（改这里即可选模块 / UI 模板） ============ */
const WORKBENCH_CONFIG = {
  title: "我的工作台",
  ui: "sidebar",            // sidebar | cardGrid | topnav | masonry
  theme: "auto",            // light | dark | auto
  style: "default",         // default|wb|macaron|ink|ocean|sunset|nord|catppuccin|rosepine|tokyonight|everforest|mono|claw
  accent: "#3b6cff",
  modules: ["todo","mem","dashboard","notes","links","resources"],
  // 资料库直连：每个模块对应一个 database 节点 id（来自 create_database.py 的 stdout）。
  // 部署脚本 deploy_to_library.py 会自动填充此处。留空 { } 表示本地降级（localStorage）。
  databases: {
    // todo:   "db_xxxxxxxxxxxxxxxx",
    // mem:    "db_xxxxxxxxxxxxxxxx",
    // notes:  "db_xxxxxxxxxxxxxxxx",
    // links:  "db_xxxxxxxxxxxxxxxx",
    // resources:"db_xxxxxxxxxxxxxxxx"
    // dashboard / news 由系统指标与动态源驱动，默认不绑定单列 database
  }
};
const CFG = WORKBENCH_CONFIG;

/* ============ 工具函数 ============ */
function el(tag,cls){const e=document.createElement(tag); if(cls)e.className=cls; return e;}
function uid(){return 'id'+Math.random().toString(36).slice(2,9);}
function pad(n){return String(n).padStart(2,'0');}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function localISO(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}

/* ============ 模块注册表（可插拔） ============ */
const REG = {};
function register(def){ REG[def.type]=def; }

register({
  type:'todo', title:'待办', icon:'✅',
  schema:[{name:'id',type:'text'},{name:'title',type:'text'},{name:'done',type:'checkbox'},
          {name:'due',type:'date'},{name:'created',type:'date'},{name:'priority',type:'select'}],
  seed:[{id:uid(),title:'欢迎使用工作台，勾选可标记完成',done:false,due:'',created:today(),priority:'中'},
        {id:uid(),title:'右上角「导出CSV」把数据落库到资料库',done:false,due:'',created:today(),priority:'高'}],
  render(slot,data,update){ slot.innerHTML='';
    const row=el('div','row'); const inp=el('input'); inp.placeholder='添加任务…';
    const sel=el('select'); ['低','中','高'].forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
    const add=el('button','btn-primary'); add.textContent='添加';
    row.append(inp,sel,add); slot.appendChild(row);
    const list=el('div','list'); slot.appendChild(list);
    function draw(){ list.innerHTML=''; data.forEach((it,idx)=>{ const item=el('div','item'+(it.done?' done':''));
      const cb=el('input'); cb.type='checkbox'; cb.checked=!!it.done; cb.onchange=()=>{data[idx].done=cb.checked;update(data);};
      const span=el('span','t'); span.textContent=it.title;
      const meta=el('span','meta'); meta.textContent=(it.priority?it.priority+' · ':'')+(it.due||'');
      const del=el('button','btn-del'); del.textContent='🗑'; del.onclick=()=>{if(confirm('删除该任务？')){data.splice(idx,1);update(data);}};
      item.append(cb,span,meta,del); list.appendChild(item); }); }
    add.onclick=()=>{ const v=inp.value.trim(); if(!v)return; data.unshift({id:uid(),title:v,done:false,due:'',created:today(),priority:sel.value}); inp.value=''; update(data); };
    inp.onkeydown=e=>{if(e.key==='Enter')add.onclick();};
    draw();
  }
});

register({
  type:'mem', title:'速记', icon:'💡',
  schema:[{name:'id',type:'text'},{name:'text',type:'text'},{name:'tags',type:'text'},{name:'created',type:'date'}],
  seed:[{id:uid(),text:'这是个零依赖单文件工作台，双击即可离线打开',tags:'tips',created:today()}],
  render(slot,data,update){ slot.innerHTML='';
    const row=el('div','row'); const inp=el('input'); inp.placeholder='记点什么…'; const tag=el('input'); tag.placeholder='标签(逗号分隔)';
    const add=el('button','btn-primary'); add.textContent='记'; row.append(inp,tag,add); slot.appendChild(row);
    const list=el('div','list'); slot.appendChild(list);
    function draw(){ list.innerHTML=''; data.slice().reverse().forEach((it,ri)=>{ const real=data.length-1-ri;
      const item=el('div','item'); const s=el('span','t'); s.textContent=it.text;
      const meta=el('span','meta'); meta.textContent=(it.tags?('#'+it.tags.split(',').map(t=>t.trim()).filter(Boolean).join(' #')):'')+'  '+it.created;
      const del=el('button','btn-del'); del.textContent='🗑'; del.onclick=()=>{if(confirm('删除？')){data.splice(real,1);update(data);}};
      item.append(s,meta,del); list.appendChild(item); }); }
    add.onclick=()=>{ if(!inp.value.trim())return; data.unshift({id:uid(),text:inp.value.trim(),tags:tag.value.trim(),created:today()}); inp.value='';tag.value=''; update(data); };
    inp.onkeydown=e=>{if(e.key==='Enter')add.onclick();};
    draw();
  }
});

register({
  type:'dashboard', title:'概览', icon:'📊',
  schema:[{name:'id',type:'text'},{name:'name',type:'text'},{name:'value',type:'number'},{name:'unit',type:'text'}],
  seed:[],
  render(slot,data,update){ slot.innerHTML='';
    // 聚合各模块当前展示数据（_display 已含 DB/本地最新值）
    function dataOf(t){ return (_display[t] && _display[t].length)? _display[t] : (REG[t]?REG[t].seed.slice():[]); }

    add.onclick=function(){ if(!na.value.trim())return; data.unshift({id:uid(),name:na.value.trim(),schedule:sc.value.trim(),desc:de.value.trim(),status:'运行中',lastRun:today()}); na.value=sc.value=de.value=''; update(data); };

/* ============ 持久化（v1.2：资料库直连 + 本地降级） ============ */
/* 设计：
   - 若模块在 WORKBENCH_CONFIG.databases 中配置了 databaseId，则运行时通过
     window.__SMART_PAGE__.database 直读直写该 database 节点（资料库 page 由平台注入 SDK）。
     字段按 schema 类型用对应信封读写（text/checkbox/number/date/select/url），与 manifest 建库类型对齐；
     主键以服务端 _id 为准（存入行 id），UI 改与外部改据此做 diff 双向同步。
   - 无 SDK 环境（本地 file:// 预览）自动降级到 localStorage，保证模板可演示。
   - 资料库模式下定时轮询 query，实现"外部改 CSV/资料库 → 前端自动刷新"。
*/
const DB = (function(){ try{ return window.__SMART_PAGE__ && window.__SMART_PAGE__.database; }catch(e){ return null; } })();
const HAS_DB = !!DB;
const DB_POLL_MS = 4000;          // 双向同步轮询间隔
const DB_PAGE = 200;
const _cache = {};                // database 模式下：最近一次服务器数据（用于 diff/合并）
const _pendingTimer = {};         // 防抖写入计时器
const _writing = {};              // 是否正在写库（写库期间暂停轮询，避免回读覆盖）
let _bootDone = false;            // renderAll 首次渲染完成

function dbIdOf(t){ return (CFG.databases && CFG.databases[t]) || null; }

// 行对象 <-> 数据库 properties（与 manifest 建库类型对齐：checkbox/number/date/select/url 各自信封，text 用 text）
function fieldEnvelope(type, v){
  switch(type){
    case 'checkbox': return {checkbox: !!v};
    case 'number':   { const n=Number(v); return {number: isFinite(n)?n:0}; }
    case 'date':     return {date: (v==null?'':String(v))};
    case 'select':   return {select: (v==null?'':String(v))};
    case 'url':      { const s=(v==null?'':String(v)); return {url:{text:s, link:s}}; }
    default:         return {text: (v==null?'':(typeof v==='object'?JSON.stringify(v):String(v)))};
  }
}
function fieldValue(type, cell){
  if(cell && typeof cell==='object'){
    if('checkbox' in cell) return !!cell.checkbox;
    if('number'  in cell) return Number(cell.number||0);
    if('date'    in cell) return cell.date||'';
    if('select'  in cell) return cell.select||'';
    if('url'     in cell) return (cell.url && (cell.url.link||cell.url.text))||'';
    if('text'    in cell) return cell.text;
    return cell;
  }
  return cell;
}
function rowToProps(t, row){ const p={}; (REG[t]?REG[t].schema:[]).forEach(c=>{ p[c.name]=fieldEnvelope(c.type, row[c.name]); }); return p; }

// 数据库记录 -> 行对象：主键以服务端 _id 为准（存入 id），按 schema 类型还原各字段信封；
// 忽略冗余的 text 型 id 列，避免覆盖主键导致 diff 错位（真实部署 DB 会返回 id 文本列）。
function recordToRow(rec, t){
  const o={}; const schema=(REG[t]&&REG[t].schema)||[]; const typeOf={}; schema.forEach(c=>{ typeOf[c.name]=c.type; });
  for(const k in rec){
    if(k==='_id'){ o.id=rec._id; continue; }
    if(k==='id'){ continue; }
    o[k]=fieldValue(typeOf[k]||'text', rec[k]);
  }
  if(!o.id) o.id=rec._id||uid();
  return o;
}
// 行数组深拷贝（行对象也拷），用于 _cache 与展示数据解耦，避免 UI 改动污染 diff 基准。
function cloneRows(rows){ return (rows||[]).map(function(r){ const c={}; for(const k in r) c[k]=r[k]; return c; }); }

// ============ 读取（异步，统一返回 Promise<array> ） ============
function storeGet(t){
  const dbId=dbIdOf(t);
  if(HAS_DB && dbId){
    return DB.query({databaseId:dbId, pageSize:DB_PAGE, sorts:[{property:'id',direction:'ascending'}]})
      .then(function(res){
        const rows=(res.results||[]).map(function(r){ return recordToRow(r, t); });
        _cache[t]=cloneRows(rows);   // 深拷贝：与展示数组解耦，UI 改动不污染 diff 基准
        // 空库自动灌入示例数据（首次部署即"开箱即用"，面板不空白）
        if(!rows.length && REG[t].seed && REG[t].seed.length){
          return seedIfEmpty(t, REG[t].seed.slice());
        }
        return rows;
      })
      .catch(function(e){ console.warn('[db] 读取 '+t+' 失败', e); return _cache[t]||REG[t].seed.slice(); });
  }
  // 本地降级
  try{ const v=JSON.parse(localStorage.getItem('wb:'+t)); return Promise.resolve(Array.isArray(v)?v:REG[t].seed.slice()); }catch(e){ return Promise.resolve(REG[t].seed.slice()); }
}
function IS_LOCAL_ID(id){ return typeof id==='string' && id.indexOf('id')===0; }
function seedIfEmpty(t, rows){
  const dbId=dbIdOf(t);
  if(!dbId) return Promise.resolve(rows);
  rows = rows.map(function(r){ const c={}; for(const k in r) c[k]=r[k]; if(c.id) delete c.id; return c; });   // 去掉本地 id，交给服务端生成
  const tasks=rows.map(function(r){ return Promise.resolve(DB.addRecord({databaseId:dbId, properties:rowToProps(t,r)})).then(function(rr){ if(rr&&rr.id) r.id=rr.id; }); });
  return Promise.all(tasks).then(function(){ _cache[t]=cloneRows(rows); return rows.slice(); }).catch(function(){ return rows.slice(); });
}

// ============ 写入（异步；UI 改 → 直写库 or localStorage） ============
function storeSet(t, arr){
  const dbId=dbIdOf(t);
  if(HAS_DB && dbId){
    _writing[t]=true;
    // 全量同步：以 UI 当前数组为准，与服务器做 diff（本地新增→add，已有变化→update，服务器有但 UI 无→delete）
    const prev=_cache[t]||[];
    const prevById={}; prev.forEach(r=>{ if(r.id) prevById[r.id]=r; });
    const nextById={}; arr.forEach(r=>{ if(r.id) nextById[r.id]=r; });
    const tasks=[];
    arr.forEach(function(r){
      if(prevById[r.id]){
        const old=prevById[r.id]; let changed=false;
        (REG[t].schema||[]).forEach(c=>{ if(String(r[c.name])!==String(old[c.name]??'')) changed=true; });
        if(changed){ tasks.push(DB.updateRecord({databaseId:dbId, recordId:r.id, properties:rowToProps(t,r)})); }
      } else if(!IS_LOCAL_ID(r.id)){
        tasks.push(DB.updateRecord({databaseId:dbId, recordId:r.id, properties:rowToProps(t,r)}));   // 已带真实 id（如重置后）
      } else {
        tasks.push(Promise.resolve(DB.addRecord({databaseId:dbId, properties:rowToProps(t,r)})).then(function(rr){ const nid=rr&&rr.id?rr.id:null; if(nid){ r.id=nid; } }));
      }
    });
    prev.forEach(function(r){ if(r.id && !nextById[r.id]) tasks.push(DB.deleteRecord({databaseId:dbId, recordId:r.id})); });
    return Promise.all(tasks).then(function(){ _cache[t]=arr.map(function(x){ const c={}; for(const k in x)c[k]=x[k]; return c; }); })
      .catch(function(e){ console.warn('[db] 写入 '+t+' 失败', e); })
      .then(function(){ _writing[t]=false; });
  }
  // 本地降级
  try{ localStorage.setItem('wb:'+t, JSON.stringify(arr)); }catch(e){}
  return Promise.resolve();
}

function refresh(t){ const slot=SLOTS[t]; if(slot&&REG[t]) REG[t].render(slot, _display[t]||[], (a)=>update(t,a)); }
const _display = {};   // 当前展示数据（本地模式 = 直接数组；数据库模式 = 合并后的最新）
function update(t,arr){
  _display[t]=arr;
  refresh(t);
  if(t!=='dashboard'&&REG.dashboard) refresh('dashboard');
  // 持久化（防抖，避免每次输入都打库）
  if(_pendingTimer[t]) clearTimeout(_pendingTimer[t]);
  _pendingTimer[t]=setTimeout(function(){ storeSet(t, arr); }, 250);
}

/* 数据库模式：定时轮询各 database 节点，外部（CSV/资料库）改动 → 前端自动刷新。
   合并策略：写库期间(_writing)暂停轮询；否则以服务器为准，并把 UI 尚未落库
   的"本地临时新增"（仍为本地 id）行补回去，同时把服务器新 id 写回 _display。 */
let _pollTimer=null;
function startPolling(){
  if(!HAS_DB) return;                 // 本地降级不需要轮询
  if(_pollTimer) return;              // 防止重复启动
  _pollTimer=setInterval(function(){
    CFG.modules.filter(t=>REG[t] && dbIdOf(t)).forEach(function(t){
      if(_writing[t]) return;        // 写库进行中，跳过本轮，避免回读覆盖刚写入的内容
      storeGet(t).then(function(rows){
        const liveIds={}; rows.forEach(r=>{ if(r.id) liveIds[r.id]=true; });
        const local=_display[t]||[];
        const pending=local.filter(r=>r.id && !liveIds[r.id]);   // 仍未落库的本地新增
        const merged=rows.concat(pending);
        const changed=JSON.stringify(merged)!==JSON.stringify(_display[t]);
        _display[t]=merged;
        if(changed && SLOTS[t]) REG[t].render(SLOTS[t], merged, (a)=>update(t,a));
      });
    });
  }, DB_POLL_MS);
}

/* ============ UI 布局（可插拔模板） ============ */
let SLOTS = {};   // 当前布局中各模块 slot 的引用，供 refresh 精准定位（避免 querySelector 命中 nav-item / 找不到 cardGrid/masonry 的 mod-body）
function buildLayout(kind, mods){
  const app=document.getElementById('app'); app.innerHTML='';
  document.body.className='layout-'+kind;
  const slots={};
  if(kind==='sidebar'){
    const side=el('aside','sidebar'); const brand=el('div','brand'); brand.textContent='🧰 '+CFG.title; side.appendChild(brand);
    const main=el('main','main');
    mods.forEach((m,i)=>{
      const ni=el('div','nav-item'+(i===0?' active':'')); ni.dataset.mod=m.type; ni.innerHTML=m.icon+' '+m.title;
      ni.onclick=()=>{document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); ni.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); slots[m.type].classList.add('active');};
      side.appendChild(ni);
      const p=el('section','panel'+(i===0?' active':'')); p.dataset.mod=m.type; main.appendChild(p); slots[m.type]=p;
    });
    app.append(side,main);
  } else if(kind==='cardGrid'){
    const tb=el('div','topbar'); tb.textContent='🧰 '+CFG.title; app.appendChild(tb);
    const grid=el('div','grid'); app.appendChild(grid);
    mods.forEach(m=>{const c=el('div','card'); const h=el('h3'); h.innerHTML=m.icon+' '+m.title; c.appendChild(h);
      const body=el('div','mod-body'); c.appendChild(body); grid.appendChild(c); slots[m.type]=body;});
  } else if(kind==='topnav'){
    const bar=el('div','topbar'); const brand=el('span','brand'); brand.textContent='🧰 '+CFG.title; bar.appendChild(brand);
    mods.forEach((m,i)=>{const t=el('span','tab'+(i===0?' active':'')); t.dataset.mod=m.type; t.innerHTML=m.icon+' '+m.title;
      t.onclick=()=>{document.querySelectorAll('.tab').forEach(n=>n.classList.remove('active')); t.classList.add('active');
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); slots[m.type].classList.add('active');};
      bar.appendChild(t);});
    app.appendChild(bar);
    const main=el('main','main'); mods.forEach((m,i)=>{const p=el('section','panel'+(i===0?' active':'')); p.dataset.mod=m.type; main.appendChild(p); slots[m.type]=p;});
    app.appendChild(main);
  } else { // masonry
    const tb=el('div','topbar'); tb.textContent='🧰 '+CFG.title; app.appendChild(tb);
    const m=el('div','masonry'); app.appendChild(m);
    mods.forEach(mod=>{const c=el('div','card'); const h=el('h3'); h.innerHTML=mod.icon+' '+mod.title; c.appendChild(h);
      const body=el('div','mod-body'); c.appendChild(body); m.appendChild(c); slots[mod.type]=body;});
  }
  return slots;
}
function renderAll(){
  const mods=CFG.modules.filter(t=>REG[t]).map(t=>({type:t,title:REG[t].title,icon:REG[t].icon}));
  if(!mods.length){ document.getElementById('app').textContent='未选择任何模块'; return; }
  SLOTS = buildLayout(CFG.ui, mods);
  mods.forEach(function(m){
    const dbId=dbIdOf(m.type);
    if(HAS_DB && dbId && SLOTS[m.type] && SLOTS[m.type].setAttribute){
      // 标注 database 绑定（满足资料库上传 SDK lint：DSDK011/012）
      SLOTS[m.type].setAttribute('data-sp-bindable','database');
      SLOTS[m.type].setAttribute('data-sp-database-id', dbId);
    }
    // 统一走 storeGet（数据库模式直读；本地模式读 localStorage）
    storeGet(m.type).then(function(rows){ _display[m.type]=rows; if(SLOTS[m.type]) REG[m.type].render(SLOTS[m.type], rows, (a)=>update(m.type,a)); });
  });
  // dashboard 聚合自多个 database，给其容器一个代表性 data-sp 标注，避免 lint 失败
  if(HAS_DB && SLOTS['dashboard'] && SLOTS['dashboard'].setAttribute){
    const firstDb=CFG.modules.filter(function(t){return dbIdOf(t);})[0];
    if(firstDb){ SLOTS['dashboard'].setAttribute('data-sp-bindable','database'); SLOTS['dashboard'].setAttribute('data-sp-database-id', dbIdOf(firstDb)); }
  }
  startPolling();   // 数据库模式：定时轮询，外部改动自动同步到前端
}

/* ============ CSV 工具 ============ */
function csvEscape(v){ if(v==null)return ''; v=String(v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function toCSV(rows, schema){ return [schema.map(c=>csvEscape(c.name)).join(','),
  ...rows.map(r=>schema.map(c=>csvEscape(r[c.name])).join(','))].join('\n'); }
function parseCSV(text){ const rows=[]; let i=0,field='',row=[],inq=false;
  while(i<text.length){ const ch=text[i];
    if(inq){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inq=false; } else field+=ch; }
    else { if(ch==='"')inq=true; else if(ch===','){row.push(field);field='';} else if(ch==='\n'){row.push(field);rows.push(row);field='';row=[];} else if(ch!=='\r')field+=ch; }
    i++; }
  if(field!==''||row.length){row.push(field);rows.push(row);} return rows; }
function fromCSV(text, schema){ const rows=parseCSV(text); if(rows.length<1)return [];
  const head=rows[0].map(h=>h.trim()); const idx={};
  schema.forEach(c=>{ idx[c.name]=head.findIndex(h=>h.toLowerCase()===c.name.toLowerCase()); });
  return rows.slice(1).map(r=>{ const o={}; schema.forEach(c=>{ let v=idx[c.name]>=0?(r[idx[c.name]]??''):''; if(c.type==='checkbox')v=(v==='true'||v==='1'||v==='✓'); o[c.name]=v; }); return o; }); }
function download(name,text){ const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}); const a=el('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportAll(){ CFG.modules.filter(t=>REG[t]).forEach(function(t){
    storeGet(t).then(function(rows){ download(t+'.csv', toCSV(rows, REG[t].schema)); }); }); toast('已导出 '+CFG.modules.filter(t=>REG[t]).length+' 个 CSV（资料库/本地同步）'); }
function importFile(file){ const r=new FileReader(); r.onload=()=>{ const text=r.result;
  let matched=null; for(const t of CFG.modules.filter(x=>REG[x])){ const head=(parseCSV(text)[0]||[]).map(h=>h.trim().toLowerCase()); if(head.some(h=>REG[t].schema.some(c=>c.name.toLowerCase()===h))){matched=t;break;} }
  if(!matched) matched=CFG.modules.find(t=>file.name.toLowerCase().includes(t))||null;
  if(!matched){ toast('无法匹配到模块'); return; }
  const arr=fromCSV(text, REG[matched].schema);
  // 整表替换语义：清空该模块再全量写入（storeSet 的 diff 会自动处理 delete+add）
  storeSet(matched, []).then(function(){ _display[matched]=arr; storeSet(matched, arr); update(matched, arr); toast('已导入到 '+REG[matched].title+'（'+arr.length+' 条）'); });
}; r.readAsText(file); }

  let mask=document.getElementById('styleMask');
  if(mask){ mask.classList.add('show'); return; }
  mask=el('div','modal-mask'); mask.id='styleMask';
  const modal=el('div','modal');
  const h=el('h3'); h.textContent='🎨 选择 UI 风格';
  const sub=el('div','sub'); sub.textContent='切换全局生效：所有布局、模块、图表同步换肤。';
  const grid=el('div','style-grid');
  STYLES.forEach(s=>{
    const card=el('div','style-card'); card.dataset.style=s.id;
    if(s.id===(CFG.style||'default')) card.classList.add('active');
    const sw=el('div','style-swatch'); sw.style.background=s.sw[2];
    s.sw.forEach((c,i)=>{ const i2=el('i'); i2.style.background=c; if(i===0)i2.style.flex='1.8'; sw.appendChild(i2); });
    const nm=el('div','style-name'); nm.textContent=s.name;
    const ds=el('div','style-desc'); ds.textContent=s.desc;
    card.append(sw,nm,ds);
    card.onclick=()=>{ applyStyle(s.id); };
    grid.appendChild(card);
  });
  const close=el('button','btn-primary'); close.textContent='完成'; close.style.marginTop='14px';
  close.onclick=()=>mask.classList.remove('show');
  mask.onclick=e=>{ if(e.target===mask)mask.classList.remove('show'); };
  modal.append(h,sub,grid,close); mask.appendChild(modal); document.body.appendChild(mask);
  mask.classList.add('show');
}

/* ============ 工具栏 ============ */
function buildToolbar(){ const bar=el('div','toolbar');
  const bExp=el('button'); bExp.textContent='⬇ 导出CSV'; bExp.onclick=exportAll;
  const bImp=el('button'); bImp.textContent='⬆ 导入CSV'; const fi=el('input'); fi.type='file'; fi.accept='.csv'; fi.style.display='none';
  bImp.onclick=()=>fi.click(); fi.onchange=()=>{ if(fi.files[0])importFile(fi.files[0]); fi.value=''; };
  const bTh=el('button'); bTh.textContent='🌓 主题'; bTh.onclick=toggleTheme;
  const bSt=el('button'); bSt.textContent='🎨 风格'; bSt.onclick=openStylePicker;
  const bRe=el('button'); bRe.textContent='↺ 重置'; bRe.onclick=()=>{ if(confirm('重置所有模块为示例数据？此操作清空本地改动。')){ CFG.modules.filter(t=>REG[t]).forEach(t=>{ _display[t]=REG[t].seed.slice(); storeSet(t, REG[t].seed.slice()); }); renderAll(); toast('已重置'); } };
  bar.append(bExp,bImp,bTh,bSt,bRe,fi); document.body.appendChild(bar); }

/* ============ 图表 ============ */
function drawBar(cv, vals, labels){ const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H); const pad=28; const max=Math.max(1,...vals); const n=vals.length||1;
  const gap=(W-pad*2)/n; const bw=Math.min(56,gap*0.6); const base=H-22;
  const css=getComputedStyle(document.documentElement);
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const axis=css.getPropertyValue('--text-dim').trim()||(dark?'#94a0b3':'#6b7280');
  const bar=css.getPropertyValue('--accent').trim()||(dark?'#5b8cff':'#3b6cff');
  ctx.strokeStyle=axis; ctx.beginPath(); ctx.moveTo(pad,base); ctx.lineTo(W-pad,base); ctx.stroke();
  vals.forEach((v,i)=>{ const x=pad+gap*i+(gap-bw)/2; const h=(v/max)*(base-pad);
    ctx.fillStyle=bar; ctx.fillRect(x,base-h,bw,h); ctx.fillStyle=axis; ctx.font='11px system-ui'; ctx.textAlign='center';
    ctx.fillText(String(v),x+bw/2,base-h-4); if(labels[i])ctx.fillText(labels[i],x+bw/2,H-6); }); }

/* ============ toast ============ */
function toast(msg){ let t=document.getElementById('toast'); if(!t){t=el('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ============ 启动 ============ */
applyStyle();          // 应用风格预设（含 default 下的自定义 accent）
applyTheme();
renderAll();
buildToolbar();
</script>
