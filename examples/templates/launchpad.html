<!doctype html>
<!--
  借鉴自 NavHub (https://github.com/1718638143/NavHub, MIT) 的设计模式：
  悬浮玻璃侧边栏 + 分类 Tab + 书签卡片网格 + 聚合搜索。
  已重写为 workbench-builder 的 token 系统、零依赖单文件（无 CDN / 无外链图标，仅 emoji+SVG）。
  用途：作为「链接/书签型工作台」模板预置到 examples/。
-->
<html lang="zh-CN" data-theme="light" data-style="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad · 导航工作台</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;
--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--danger:#e5484d;--ok:#2fa66a;
--radius:14px;--shadow:0 4px 18px rgba(20,30,60,.08);--gap:16px}
[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;
--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740;--shadow:0 4px 18px rgba(0,0,0,.45)}
[data-style="default"]{--bg:#f5f6f8;--surface:#fff;--surface-2:#eef0f4;--text:#1f2430;--text-dim:#6b7280;--border:#e3e6ec;--accent:#3b6cff;--accent-weak:#e8efff;--radius:14px}
[data-style="default"][data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1f2530;--text:#e7ebf2;--text-dim:#94a0b3;--border:#2a313d;--accent:#5b8cff;--accent-weak:#1c2740}
[data-style="macaron"]{--bg:#fbf7fc;--surface:#fff;--surface-2:#f4edf8;--text:#4a4258;--text-dim:#9b8fae;--border:#ece2f3;--accent:#b48ad4;--accent-weak:#f1e9fb;--radius:18px}
[data-style="macaron"][data-theme="dark"]{--bg:#171320;--surface:#211a2c;--surface-2:#2a2236;--text:#efeaf6;--text-dim:#b3a6c4;--border:#352b45;--accent:#c9a3e6;--accent-weak:#2e2440}
[data-style="ink"]{--bg:#fafafa;--surface:#fff;--surface-2:#f0f0f3;--text:#18181b;--text-dim:#71717a;--border:#e4e4e7;--accent:#33334d;--accent-weak:#eaeaef;--radius:8px}
[data-style="ink"][data-theme="dark"]{--bg:#0a0a0b;--surface:#161618;--surface-2:#232326;--text:#fafafa;--text-dim:#a1a1aa;--border:#2e2e32;--accent:#a0a0c8;--accent-weak:#26263a}
[data-style="ocean"]{--bg:#f1f8f9;--surface:#fff;--surface-2:#e3f1f2;--text:#1c3a3d;--text-dim:#5b858a;--border:#d3e8ea;--accent:#0f8b8f;--accent-weak:#d8f0f1;--radius:12px}
[data-style="ocean"][data-theme="dark"]{--bg:#0b1719;--surface:#132225;--surface-2:#1b2e31;--text:#e2f1f2;--text-dim:#7fafb1;--border:#224044;--accent:#2bc4c0;--accent-weak:#16383a}
[data-style="sunset"]{--bg:#fff6f2;--surface:#fff;--surface-2:#fdeae2;--text:#4a2e26;--text-dim:#a9786a;--border:#f6dccf;--accent:#f0735f;--accent-weak:#ffe2d8;--radius:16px}
[data-style="sunset"][data-theme="dark"]{--bg:#1c1012;--surface:#281a1c;--surface-2:#332225;--text:#fbeae4;--text-dim:#c39a8e;--border:#43292b;--accent:#ff8a72;--accent-weak:#3a2220}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--text);transition:background .2s,color .2s;display:flex;min-height:100vh}
input,button,select{font:inherit;color:inherit}
input,select{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none}
input:focus{border-color:var(--accent)}
button{cursor:pointer;border:none;border-radius:10px;padding:8px 14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface-2);border:1px solid var(--border)}
/* 玻璃侧边栏 */
.side{padding:18px 14px;display:flex;flex-direction:column;gap:4px;min-height:100vh;position:sticky;top:0;
background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(14px);
border-right:1px solid var(--border);width:220px;flex:0 0 220px}
.side .brand{font-weight:700;font-size:16px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.cat{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.cat.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.spacer{flex:1}
.iconbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:13px}
.iconbtn:hover{background:var(--accent-weak);color:var(--accent)}
/* 主区 */
.main{flex:1;padding:24px;max-width:1100px}
.searchbar{display:flex;gap:8px;margin-bottom:20px}
.searchbar input{flex:1}
.engine{flex:0 0 130px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;color:var(--text-dim)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gap)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
padding:14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);transition:.15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .ico{font-size:20px}
.card .t{font-weight:600}
.card .d{color:var(--text-dim);font-size:12px}
.empty{color:var(--text-dim);padding:20px 0}
@media(max-width:720px){body{flex-direction:column}.side{width:100%;flex:none;min-height:auto;flex-direction:row;overflow:auto;border-right:none;border-bottom:1px solid var(--border)}.main{padding:16px}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">🚀 Launchpad</div>
  <div id="cats"></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="theme">🌓 主题</button>
  <button class="iconbtn" id="style">🎨 风格</button>
</aside>
<main class="main">
  <div class="searchbar">
    <select class="engine" id="engine"></select>
    <input id="q" placeholder="搜索…（回车跳转）">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</main>

<script>
/* ===== 数据（改这里即可定制导航） ===== */
const ENGINES=[{name:'Google',url:'https://www.google.com/search?q=%s'},{name:'Bing',url:'https://www.bing.com/search?q=%s'},{name:'百度',url:'https://www.baidu.com/s?wd=%s'}];
const CATEGORIES=[
  {name:'常用', icon:'⭐', sites:[
    {t:'WorkBuddy',d:'本地 AI 助手',u:'https://www.workbuddy.cn',i:'🤖'},
    {t:'GitHub',d:'代码托管',u:'https://github.com',i:'🐙'},
    {t:'飞书',d:'协作',u:'https://www.feishu.cn',i:'📋'}
  ]},
  {name:'设计', icon:'🎨', sites:[
    {t:'Figma',d:'UI 设计',u:'https://www.figma.com',i:'🟣'},
    {t:'Dribbble',d:'灵感',u:'https://dribbble.com',i:'🏀'},
    {t:'Coolors',d:'配色',u:'https://coolors.co',i:'🌈'}
  ]},
  {name:'开发', icon:'🛠', sites:[
    {t:'MDN',d:'Web 文档',u:'https://developer.mozilla.org',i:'📚'},
    {t:'Stack Overflow',d:'问答',u:'https://stackoverflow.com',i:'📑'},
    {t:'Can I Use',d:'兼容性',u:'https://caniuse.com',i:'✅'}
  ]}
];

/* ===== 主题 / 风格（与全 skill token 系统一致） ===== */
const STYLES=['default','macaron','ink','ocean','sunset'];
function applyTheme(){const s=localStorage.getItem('wb:theme');const sys=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  const use=s||'light';document.documentElement.setAttribute('data-theme',use);}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';
  localStorage.setItem('wb:theme',n);applyTheme();}
function applyStyle(){const id=localStorage.getItem('wb:style')||'default';document.documentElement.setAttribute('data-style',id);}
function pickStyle(){let cur=document.documentElement.getAttribute('data-style');
  const i=STYLES.indexOf(cur);const n=STYLES[(i+1)%STYLES.length];localStorage.setItem('wb:style',n);applyStyle();toast('风格：'+n);}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:30;font-size:13px';document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',1600);}

/* ===== 渲染 ===== */
let activeCat=0, activeTab=0;
function renderCats(){const wrap=document.getElementById('cats');wrap.innerHTML='';
  CATEGORIES.forEach((c,i)=>{const el=document.createElement('div');el.className='cat'+(i===activeCat?' active':'');
    el.innerHTML=c.icon+' '+c.name;el.onclick=()=>{activeCat=i;activeTab=0;renderCats();renderTabs();renderGrid();};wrap.appendChild(el);});}
function renderEngine(){const sel=document.getElementById('engine');sel.innerHTML='';
  ENGINES.forEach(e=>{const o=document.createElement('option');o.value=e.url;o.textContent=e.name;sel.appendChild(o);});}
function renderTabs(){const wrap=document.getElementById('tabs');wrap.innerHTML='';
  const cats=CATEGORIES[activeCat].sites.reduce((a,s)=>{if(!a.includes(s.t[0]))a.push(s.t[0]);return a;},[]);
  const tabs=['全部',...cats];
  tabs.forEach((t,i)=>{const el=document.createElement('div');el.className='tab'+(i===activeTab?' active':'');el.textContent=t;
    el.onclick=()=>{activeTab=i;renderTabs();renderGrid();};wrap.appendChild(el);});}
function renderGrid(){const grid=document.getElementById('grid');grid.innerHTML='';
  let sites=CATEGORIES[activeCat].sites;
  if(activeTab>0){const letter=document.querySelectorAll('.tab')[activeTab].textContent;sites=sites.filter(s=>s.t[0]===letter);}
  if(!sites.length){grid.innerHTML='<div class="empty">该分类下暂无站点</div>';return;}
  sites.forEach(s=>{const a=document.createElement('a');a.className='card';a.href=s.u;a.target='_blank';a.rel='noopener';
    a.innerHTML='<div class="ico">'+(s.i||'🔗')+'</div><div class="t">'+s.t+'</div><div class="d">'+s.d+'</div>';grid.appendChild(a);});}

document.getElementById('theme').onclick=toggleTheme;
document.getElementById('style').onclick=pickStyle;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const url=document.getElementById('engine').value.replace('%s',encodeURIComponent(e.target.value));if(url)window.open(url,'_blank');}});
applyTheme();applyStyle();renderEngine();renderCats();renderTabs();renderGrid();
</script>
</body>
</html>
